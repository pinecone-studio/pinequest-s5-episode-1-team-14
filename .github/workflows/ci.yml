name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run test:knowledge --workspace=backend
      - run: npm run test:calendar --workspace=backend
      - run: npm run test:calls --workspace=backend
      - run: npm run test:analytics --workspace=pwa
      - run: npm run build:backend
      - run: npm run build:pwa
